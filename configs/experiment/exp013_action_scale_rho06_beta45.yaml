experiment:
  name: exp013_action_scale_rho06_beta45
  seed: 7
  num_envs: 32
  device: cuda
  total_steps: 120000
  rollout_steps: 32
  log_dir: outputs/logs/exp013_action_scale_rho06_beta45
  checkpoint_dir: outputs/checkpoints
  checkpoint_name: exp013_action_scale_rho06_beta45.pt
  run_dir: outputs/runs
  save_checkpoint: true
  require_skrl_import: true

evaluation:
  proxy_eval:
    enabled: true
    num_envs: 256
    steps: 160
    seed_offset: 1000
  high_fidelity_eval:
    enabled: true
    backend: physx_jetbot
    trigger: proxy_passed
    terrain: flat
    episodes: 3
    steps: 100
    sim_steps_per_control: 8
    render: false

simulation:
  episode_length_s: 20.0
  physics_dt: 0.05
  control_decimation: 4

task:
  n_agents: 4

planner:
  rho_max: 0.6
  beta_max: 0.78539816339

algorithm:
  mode: pure_rl
  training_semantics: exp013_action_scale_rho06_beta45
  shared_actor: true
  centralized_critic: true
  shared_value: true
  gamma: 0.99
  learning_rate: 0.0005
