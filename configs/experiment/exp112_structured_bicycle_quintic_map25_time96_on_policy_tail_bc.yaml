extends: exp099_structured_bicycle_quintic_map25_time96_full_center_correction.yaml

experiment:
  name: exp112_structured_bicycle_quintic_map25_time96_on_policy_tail_bc

algorithm:
  training_semantics: exp112_structured_bicycle_quintic_map25_time96_on_policy_tail_bc
  # Retain exp099's fixed terrain-aware center correction and re-anchor only
  # on the current BC32 checkpoint.  Unlike exp110, this teacher does not
  # change the Actor target: it labels states actually visited near terminal
  # geometry with the existing fixed assigned slots.
  init_checkpoint: outputs/runs/exp092_structured_bicycle_quintic_map25_flatness_center_early_radius35/bc_reanchor_exp073_seed23_32_flatness_early_radius35/checkpoints/best.pt
  bc_updates: 8
  bc_batch_size: 8192
  bc_learning_rate: 0.00001
  teacher_mode: oracle_slots
  teacher_stop_radius: 0.45
  teacher_slow_distance: 0.0
  teacher_max_rho: 1.6
  teacher_terrain_scale: false
  bc_yaw_noise_degrees: 20.0
  bc_min_nearest_distance: 0.34
  # Build one replay reservoir from 480 policy steps, retaining states that
  # are near both geometric terminal thresholds.  Every BC update is 50%
  # policy-visited tail data and 50% ordinary random-state coverage.
  bc_on_policy_rollout_steps: 480
  bc_on_policy_tail_fraction: 0.50
  bc_on_policy_dmax_multiplier: 2.0
  bc_on_policy_dispersion_multiplier: 2.0
