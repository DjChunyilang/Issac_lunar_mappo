extends: exp116_structured_bicycle_quintic_map25_time96_linear_gain32.yaml

experiment:
  name: exp119_structured_bicycle_quintic_map25_time96_anchored_tail_bc_gain32

algorithm:
  training_semantics: exp119_structured_bicycle_quintic_map25_time96_anchored_tail_bc_gain32
  init_checkpoint: outputs/runs/exp092_structured_bicycle_quintic_map25_flatness_center_early_radius35/bc_reanchor_exp073_seed23_32_flatness_early_radius35/checkpoints/best.pt
  # The direct fixed-slot teacher reaches 92.09% success at this control
  # point, whereas the student reaches 89.16%.  Correct only policy-visited
  # near-terminal states and self-distil all other snapshots from BC32 so a
  # small update cannot overwrite the successful global approach behaviour.
  bc_updates: 8
  bc_batch_size: 8192
  bc_learning_rate: 0.00001
  teacher_mode: oracle_slots
  teacher_stop_radius: 0.45
  teacher_slow_distance: 0.0
  teacher_max_rho: 1.6
  teacher_terrain_scale: false
  bc_yaw_noise_degrees: 20.0
  bc_min_nearest_distance: 0.34
  bc_on_policy_rollout_steps: 480
  bc_on_policy_tail_fraction: 0.50
  bc_on_policy_dmax_multiplier: 2.0
  bc_on_policy_dispersion_multiplier: 2.0
  bc_on_policy_anchor_base_policy: true
