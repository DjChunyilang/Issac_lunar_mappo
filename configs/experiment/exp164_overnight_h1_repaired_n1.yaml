extends: exp157_h1_site_belief_n1.yaml

experiment:
  name: exp164_overnight_h1_repaired
  seed: 23
  num_envs: 256
  rollout_steps: 64
  checkpoint_interval: 12800
  telemetry_interval: 32
  tensorboard_interval: 32

algorithm:
  training_semantics: exp164_overnight_h1_repaired_standard_gae
  advantage_estimator: gae
  actor_architecture: multiscale_n1_cnn
  critic_architecture: structured_multiscale_v3
  entropy_schedule_timesteps: 307200
  bc_updates: 0
  init_checkpoint: null

full_rl_ablation:
  candidates:
    - multiscale_n1_cnn
  seed: 23
  policy_iterations_per_stage: 1600
  stages: 3
  timesteps: 307200
  environment_interactions_per_candidate: 78643200
  environment_interactions_total: 78643200
  equal_budget_required: false
  paired_scenarios_required: false

bounded_curriculum:
  enabled: true
  transition_mode: fixed_schedule
  evaluation_num_envs: 384
  evaluation_steps: 480
  evaluation_seed_offset: 16400
  maximum_extension_iterations: 0
  stages:
    - name: stage_a_open_near_soft_collision
      policy_iterations: 1600
      evaluation_interval_iterations: 200
      environment_overrides:
        safety.collision_termination_enabled: false
        initial_state.spawn_radius_min: 2.4
        initial_state.spawn_radius_max: 3.4
        initial_state.center_xy_range: 1.0
        initial_state.jitter_std: 0.25
        terrain.topology_profile: runtime_bucketed
        terrain.topology_curriculum_stage: open
        terrain.crater_count: 30
        terrain.crater_seed: 4
        terrain.crater_depth_to_diameter: 0.15
      gate:
        success_rate: 0.50
        collision_rate: 0.20
        dmax_reduction_ratio: 0.45
    - name: stage_b_open_near_hard_collision
      policy_iterations: 1600
      evaluation_interval_iterations: 200
      environment_overrides:
        safety.collision_termination_enabled: true
        initial_state.spawn_radius_min: 2.4
        initial_state.spawn_radius_max: 3.4
        initial_state.center_xy_range: 1.0
        initial_state.jitter_std: 0.25
        terrain.topology_profile: runtime_bucketed
        terrain.topology_curriculum_stage: open
        terrain.crater_count: 30
        terrain.crater_seed: 4
        terrain.crater_depth_to_diameter: 0.15
      gate:
        success_rate: 0.75
        collision_rate: 0.08
        timeout_rate: 0.15
        timeout_operator: le
    - name: stage_c_feasible_mixed_bottleneck_far
      policy_iterations: 1600
      evaluation_interval_iterations: 200
      environment_overrides:
        safety.collision_termination_enabled: true
        initial_state.spawn_radius_min: 4.5
        initial_state.spawn_radius_max: 6.5
        initial_state.center_xy_range: 2.0
        initial_state.jitter_std: 0.40
        terrain.topology_profile: runtime_bucketed
        terrain.topology_curriculum_stage: mixed_bottleneck
        terrain.crater_count: 30
        terrain.crater_seed: 4
        terrain.crater_depth_to_diameter: 0.15
      gate:
        success_rate: 0.85
        collision_rate: 0.04
        timeout_rate: 0.10
        timeout_operator: lt

benchmark_scope:
  diagnostic_goal_conditioned_upper_bound: true
  active_dstc_certificate_in_actor: false
  repaired_bottleneck_crater_count: 30
  strict_decentralized_result: false
