planner:
  action_type: local_subgoal_polar
  action_dim: 2
  action_fields: [rho, beta]
  output_coordinate: body_relative
  rho_max: 1.2
  beta_max: 1.57079632679

gather_point:
  # 每个 episode 在地形随机化和初始状态采样后搜索一次，episode 内保持固定。
  search_method: terrain_aware_multiresolution
  coarse_grid_size: 9
  refinement_grid_size: 5
  refinement_levels: 2
  search_margin: 1.5
  global_fallback_enabled: true
  global_grid_size: 33
  global_beam_width: 32
  global_refinement_levels: 2
  global_max_envs_per_batch: 8
  flatness_radius: 0.75
  flatness_rings: 3
  flatness_samples_per_ring: 12
  max_height_range: 0.18
  max_slope: 0.25
  mean_distance_weight: 1.0
  max_distance_weight: 0.25
  path_risk_weight: 0.75
  path_height_change_weight: 0.25
  flatness_weight: 0.25
  path_samples: 5
  infeasible_penalty: 1000.0
  max_envs_per_batch: 64
  require_flat_for_success: true

trajectory_generator:
  input_type: local_subgoal
  output_type: time_stamped_trajectory
  n_trajectory_points: 8
  geometry_method: line
  terrain_height_query: false
  assign_timestamp: true
  assign_reference_speed: true
  reference_speed: 0.8

low_level_control:
  first_stage_mode: simplified_velocity_tracking
  command_type: body_twist
  command_fields: [v_cmd, omega_cmd]
  isaac_articulation_interface: proxy_unicycle
  max_linear_speed: 1.0
  max_angular_speed: 2.5
